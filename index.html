(function(){
  function b64b(s){ var t=atob(s), a=new Uint8Array(t.length); for (var i=0;i<t.length;i++) a[i]=t.charCodeAt(i); return a; }
  var salt = b64b(window.MT_SALT);
  function derive(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function(km){ return crypto.subtle.deriveBits({ name:'PBKDF2', salt:salt, iterations:window.MT_ITER, hash:'SHA-256' }, km, 512); })
      .then(function(bits){
        var a = new Uint8Array(bits);
        return Promise.all([
          crypto.subtle.importKey('raw', a.slice(0,32), { name:'AES-CBC' }, false, ['decrypt']),
          crypto.subtle.importKey('raw', a.slice(32,64), { name:'HMAC', hash:'SHA-256' }, false, ['verify'])
        ]);
      });
  }
  function decrypt(pw){
    var buf = b64b(window.MT_SHELL);
    var iv = buf.slice(0,16), mac = buf.slice(16,48), ct = buf.slice(48);
    var mi = new Uint8Array(iv.length + ct.length); mi.set(iv,0); mi.set(ct, iv.length);
    return derive(pw).then(function(ks){
      return crypto.subtle.verify('HMAC', ks[1], mac, mi).then(function(ok){
        if (!ok) throw new Error('bad');
        return crypto.subtle.decrypt({ name:'AES-CBC', iv: iv }, ks[0], ct);
      });
    });
  }
  function openMirror(pw){
    document.getElementById('err').textContent = '';
    var btn = document.getElementById('go'); btn.disabled = true; btn.textContent = '解锁中…';
    decrypt(pw).then(function(pt){
      sessionStorage.setItem('mt-pw', pw);
      var html = new TextDecoder('utf-8').decode(pt);
      document.open(); document.write(html); document.close();
    }).catch(function(){
      sessionStorage.removeItem('mt-pw');
      btn.disabled = false; btn.textContent = '解锁';
      document.getElementById('err').textContent = '密码不对，再试一次？';
    });
  }
  document.getElementById('go').addEventListener('click', function(){ var v = document.getElementById('pw').value.trim(); if (v) openMirror(v); });
  document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var v = this.value.trim(); if (v) openMirror(v); } });
  var saved = sessionStorage.getItem('mt-pw');
  if (saved) { openMirror(saved); }
})();
