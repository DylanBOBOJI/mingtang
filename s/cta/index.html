<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>CTA 监测台 · 密文分享</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;display:grid;place-items:center;background:#EEF1F4;background-image:radial-gradient(54% 42% at 50% -6%,rgba(18,43,70,.12),rgba(18,43,70,0) 70%),linear-gradient(180deg,#F7F8FA,#E9EDF1 70%,#F7F8FA);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;color:#272E37}
.card{width:min(92vw,400px);background:#fff;border-top:4px solid #C6A15B;padding:34px 30px 22px;box-shadow:0 2px 6px rgba(18,43,70,.05),0 30px 70px -34px rgba(18,43,70,.35);text-align:center}
.tag{font-size:12px;letter-spacing:.32em;color:#8B94A0}
h1{font-family:Georgia,"Songti SC","SimSun",serif;font-weight:500;font-size:40px;margin:12px 0 6px;letter-spacing:.06em;color:#122B46;line-height:1.25}
.sub{font-size:13px;color:#8B94A0;line-height:1.9;margin-bottom:22px}
input{width:100%;height:46px;border:1px solid rgba(18,43,70,.16);border-radius:6px;padding:0 14px;font-size:16px;color:#272E37;background:#F7F8FA;outline:none;text-align:center;letter-spacing:.08em}
input:focus{border-color:#C6A15B;box-shadow:0 0 0 3px rgba(198,161,91,.18)}
button{width:100%;height:46px;margin-top:12px;border:0;border-radius:6px;background:#122B46;color:#F4EBD7;font-size:15px;letter-spacing:.18em;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{margin-top:12px;font-size:13px;color:#C05B48;min-height:18px}
.foot{margin-top:16px;font-size:11.5px;color:#B6BEC8;line-height:1.8}
</style>
</head>
<body>
<div class="card">
  <div class="tag">工作台 · 密文分享</div>
  <h1>CTA 监测台</h1>
  <div class="sub">本页内容为密文快照。<br>请输入约定密码。</div>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="密码">
  <button id="go">解锁</button>
  <div class="err" id="err"></div>
  <div class="foot">密文快照 · 更新于 2026-10-16 21:18</div>
</div>
<script>
window.MT_SALT='ejCia+Q0pIFDK2gu6L3rcg==';
window.MT_ITER=200000;
window.MT_VER='202610162118';
(function(){
  function b64b(s){ var t=atob(s), a=new Uint8Array(t.length); for (var i=0;i<t.length;i++) a[i]=t.charCodeAt(i); return a; }
  var salt = b64b(window.MT_SALT);
  function derive(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function(km){ return crypto.subtle.deriveBits({ name:'PBKDF2', salt:salt, iterations:window.MT_ITER, hash:'SHA-256' }, km, 512); })
      .then(function(bits){
        var a = new Uint8Array(bits);
        return Promise.all([
          crypto.subtle.importKey('raw', a.slice(0,32), { name:'AES-CBC' }, false, ['decrypt']),
          crypto.subtle.importKey('raw', a.slice(32,64), { name:'HMAC', hash:'SHA-256' }, false, ['verify'])
        ]);
      });
  }
  function decrypt(pw, buf){
    var iv = buf.slice(0,16), mac = buf.slice(16,48), ct = buf.slice(48);
    var mi = new Uint8Array(iv.length + ct.length); mi.set(iv,0); mi.set(ct, iv.length);
    return derive(pw).then(function(ks){
      return crypto.subtle.verify('HMAC', ks[1], mac, mi).then(function(ok){
        if (!ok) throw new Error('bad');
        return crypto.subtle.decrypt({ name:'AES-CBC', iv: iv }, ks[0], ct);
      });
    });
  }
  function render(html){
    var fr = document.createElement('iframe');
    fr.setAttribute('title','内容');
    fr.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:0';
    var b = document.body;
    b.innerHTML = '';
    b.style.cssText = 'margin:0;overflow:hidden;background:#fff';
    b.appendChild(fr);
    fr.srcdoc = html;
  }
  function openPage(pw){
    document.getElementById('err').textContent = '';
    var btn = document.getElementById('go'); btn.disabled = true; btn.textContent = '解锁中…';
    fetch('p.bin?v=' + window.MT_VER).then(function(r){
      if (!r.ok) throw new Error('net');
      return r.arrayBuffer();
    }).then(function(buf){
      return decrypt(pw, new Uint8Array(buf));
    }).then(function(pt){
      sessionStorage.setItem('mt-spw', pw);
      render(new TextDecoder('utf-8').decode(pt));
    }).catch(function(e){
      sessionStorage.removeItem('mt-spw');
      btn.disabled = false; btn.textContent = '解锁';
      document.getElementById('err').textContent = (e && String(e.message) === 'bad') ? '密码不对，再试一次？' : '加载失败（网络或浏览器），请重试。';
    });
  }
  document.getElementById('go').addEventListener('click', function(){ var v = document.getElementById('pw').value.trim(); if (v) openPage(v); });
  document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var v = this.value.trim(); if (v) openPage(v); } });
  var saved = sessionStorage.getItem('mt-spw');
  if (saved) { openPage(saved); }
})();
</script>
</body>
</html>
